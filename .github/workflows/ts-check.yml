name: TypeScript check

# The typecheck and the TypeScript tests, on every pull request and on every push to a
# branch other than main. It deploys nothing: pages.yml is the only workflow that
# publishes, and it runs on main alone. The TypeScript tests need no Python; pages.yml also
# runs the refresh checks, which make PNGs with cairosvg.

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install the TypeScript toolchain
        working-directory: ts
        run: npm ci

      - name: Typecheck
        working-directory: ts
        run: npm run typecheck

      - name: Test
        working-directory: ts
        run: npm test
